<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tier Maker - Exercices de Musculation</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="main-content">
        <h1>Tier Maker - Exercices de Musculation</h1>
        <button id="downloadBtn">Télécharger en .png</button>

        <div class="tier-container">
          <div class="tier-row s-tier">
            <div class="tier-label">S Tier</div>
            <div class="tier-items" data-tier="S"></div>
          </div>
          <div class="tier-row a-tier">
            <div class="tier-label">A Tier</div>
            <div class="tier-items" data-tier="A"></div>
          </div>
          <div class="tier-row b-tier">
            <div class="tier-label">B Tier</div>
            <div class="tier-items" data-tier="B"></div>
          </div>
          <div class="tier-row c-tier">
            <div class="tier-label">C Tier</div>
            <div class="tier-items" data-tier="C"></div>
          </div>
          <div class="tier-row d-tier">
            <div class="tier-label">D Tier</div>
            <div class="tier-items" data-tier="D"></div>
          </div>
        </div>
      </div>

      <div class="exercise-pool" id="exercisePool">
        <!-- Suppression du titre h2 -->
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="assets/js/exercises.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
